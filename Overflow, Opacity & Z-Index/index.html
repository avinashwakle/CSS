<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overflow, Opacity & Z-Index</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Overflow, Opacity & Z-Index</h1>

    <!-- Overflow -->
    <div class="overflow-box">
        <h2>Overflow</h2>
        <p>
            This is a long paragraph used to demonstrate
            the overflow property in CSS. When the content
            is larger than the box, overflow controls how
            the extra content is displayed.
        </p>
    </div>

    <!-- Opacity -->
    <div class="opacity-box">
        <h2>Opacity</h2>
        <p>This box has 50% opacity.</p>
    </div>

    <!-- Z-Index -->
    <div class="z-container">
        <div class="box box-one">Box 1</div>
        <div class="box box-two">Box 2</div>
    </div>

</body>
</html>
