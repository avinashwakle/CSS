<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Types</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        .internal {
            color: green;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>Three Types of CSS</h1>

    <!-- Inline CSS -->
    <p style="color: red; font-size: 20px;">
        This is Inline CSS
    </p>

    <!-- Internal CSS -->
    <p class="internal">
        This is Internal CSS
    </p>

    <!-- External CSS -->
    <p class="external">
        This is External CSS
    </p>

</body>
</html>
