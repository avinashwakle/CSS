<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Position Property</h1>
    </header>

    <div class="container">

        <div class="box static">
            Static
        </div>

        <div class="box relative">
            Relative
        </div>

        <div class="parent">
            <div class="box absolute">
                Absolute
            </div>
        </div>

        <div class="box sticky">
            Sticky
        </div>

        <p class="content">
            Scroll the page to see how different position properties work.
        </p>

    </div>

    <div class="fixed">
        Fixed
    </div>

</body>
</html>
